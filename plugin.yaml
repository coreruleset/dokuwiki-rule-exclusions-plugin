# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "dokuwiki-rule-exclusions-plugin"
  description: "CRS rule exclusions for DokuWiki"
  long_description: |
    Provides targeted rule exclusions to eliminate false positives when
    running OWASP CRS in front of DokuWiki, a simple and versatile wiki
    software that doesn't require a database. Covers page editing and
    autosave, file uploads, the admin area, login and password reset
    forms, and saving the wiki configuration.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/dokuwiki-rule-exclusions-plugin"
  keywords:
    - "dokuwiki"
    - "wiki"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9509000
  end: 9509999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/dokuwiki-rule-exclusions-config.conf"
  variables:
    - name: "tx.dokuwiki-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable the DokuWiki rule exclusions (0 to disable)"
